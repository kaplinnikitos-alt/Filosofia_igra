<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17131d"><title>Город Солнца — Бункер</title>
<style>
:root{--bg:#f5f1f7;--panel:rgba(255,255,255,.88);--solid:#fff;--tx:#241d2b;--muted:#817789;--line:rgba(75,54,83,.14);--accent:#d86f9c;--accent2:#9d5b91;--soft:#f7e5ef;--good:#438b70;--bad:#bd526c;--shadow:0 16px 50px rgba(44,25,49,.12);--photo:url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2000&q=85');color-scheme:light}
:root[data-theme="dark"]{--bg:#15121a;--panel:rgba(31,25,38,.88);--solid:#211b29;--tx:#f4edf7;--muted:#a99daf;--line:rgba(240,220,245,.12);--accent:#e58ab1;--accent2:#b878b0;--soft:#3a2738;--good:#75c5a4;--bad:#f18aa0;--shadow:0 16px 55px rgba(0,0,0,.32);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{min-height:100vh}.scene{min-height:100vh;background:linear-gradient(115deg,rgba(17,13,23,.78),rgba(36,20,43,.55)),var(--photo) center/cover fixed;padding:24px 16px 48px}.shell{max-width:920px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin:0 auto 22px;gap:12px}.brand{font-size:18px;font-weight:800;letter-spacing:.02em}.brand small{display:block;font-size:11px;font-weight:500;opacity:.7;letter-spacing:.12em;text-transform:uppercase}.top-actions{display:flex;gap:8px}.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(20,15,27,.45);color:#fff;backdrop-filter:blur(12px)}.hero{color:#fff;text-align:center;margin:32px auto 24px;max-width:650px}.hero h1{font-size:clamp(36px,7vw,64px);letter-spacing:-.055em;line-height:1.05;margin:0 0 12px}.hero p{color:rgba(255,255,255,.78);margin:0}.panel{background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin:14px 0}.panel h2{margin:0 0 8px;font-size:21px;letter-spacing:-.03em}.muted{color:var(--muted)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:800;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--solid);color:var(--tx);border-radius:12px;padding:12px 13px;outline:none}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}.btn{border:1px solid var(--line);background:var(--solid);color:var(--tx);border-radius:13px;padding:12px 16px;font-weight:750;transition:transform .15s,filter .15s}.btn:hover{transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff}.btn.ghost{background:transparent}.btn.small{padding:8px 12px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.actions .btn{flex:1}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.code{font-size:32px;font-weight:900;letter-spacing:.2em;color:var(--accent);margin:5px 0}.share{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:16px}.qr{width:120px;height:120px;background:white;border-radius:12px;padding:6px}.link{font-size:13px;word-break:break-all;color:var(--muted)}.avatars{display:flex;flex-wrap:wrap;gap:9px}.avatar{min-width:92px;flex:1;text-align:center;border:1px solid var(--line);background:var(--solid);border-radius:14px;padding:12px 8px}.avatar b{display:block;font-size:13px}.avatar i{font-style:normal;font-size:25px;display:block;margin-bottom:5px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:var(--soft);color:var(--accent2);padding:5px 10px;font-size:12px;font-weight:800}.timer{font-size:clamp(36px,8vw,64px);font-weight:900;letter-spacing:-.06em;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}.count-wrap{text-align:center;color:#fff}.count-wrap .timer{font-size:clamp(100px,25vw,220px);color:#f3a8ca;text-shadow:0 0 45px rgba(239,124,178,.5)}.count-wrap h2{font-size:clamp(20px,4vw,32px)}.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.player{border:1px solid var(--line);background:var(--solid);border-radius:17px;padding:14px;min-width:0}.player.dead{opacity:.48;filter:grayscale(.65)}.player-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.player-head strong{font-size:16px}.player-sub{font-size:12px;color:var(--muted)}.role{display:inline-block;border-radius:8px;background:var(--soft);color:var(--accent2);font-size:12px;font-weight:800;padding:4px 8px;margin:9px 0}.funline{font-size:13px;color:var(--muted);margin:4px 0}.stat{border-radius:12px;background:var(--bg);padding:10px;margin-top:8px;font-size:13px}.stat b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}.details{margin-top:10px}.details summary{cursor:pointer;color:var(--accent2);font-size:13px;font-weight:800}.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:9px}.chip{background:var(--bg);border-radius:10px;padding:8px;font-size:12px}.chip small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.secret{border:1px dashed var(--bad);border-radius:15px;padding:15px;background:color-mix(in srgb,var(--bad) 8%,var(--panel));margin-top:12px}.secret strong{color:var(--bad)}.vote-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}.vote{padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--solid);color:var(--tx);text-align:left}.vote.selected{border:2px solid var(--accent);background:var(--soft)}.vote b{display:block}.vote small{color:var(--muted)}.final-image{width:100%;height:250px;object-fit:cover;border-radius:16px;margin:12px 0}.fate{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.fate:last-child{border:0}.fate strong{display:block}.fate small{display:block;color:var(--muted)}.badge-good{color:var(--good);font-weight:800}.badge-bad{color:var(--bad);font-weight:800}#err{color:var(--bad);font-weight:700;margin-top:12px;min-height:20px}.reactions{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:30;background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px}.reactions button{border:0;background:transparent;width:44px;height:42px;border-radius:12px;font-size:24px}.reactions button:hover{background:var(--soft)}.float-layer{position:fixed;right:15px;bottom:10px;width:90px;height:85vh;pointer-events:none;z-index:31;overflow:hidden}.float-emoji{position:absolute;bottom:-45px;font-size:34px;animation:floatUp 2.5s ease-out forwards;filter:drop-shadow(0 4px 8px #0005)}@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-82vh) translateX(var(--drift)) scale(1.25);opacity:0}}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--solid);border:1px solid var(--line);padding:10px 15px;border-radius:99px;box-shadow:var(--shadow);z-index:50}.hidden{display:none!important}.smalltext{font-size:13px}.center{text-align:center}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:650px){.scene{padding:14px 12px 90px;background-attachment:scroll}.split,.grid{grid-template-columns:1fr}.panel{padding:17px;border-radius:18px}.share{grid-template-columns:90px 1fr}.qr{width:90px;height:90px}.reactions{top:auto;bottom:10px;left:50%;right:auto;transform:translateX(-50%);flex-direction:row;padding:5px;gap:1px}.reactions button{width:38px;height:38px;font-size:21px}.float-layer{right:10px;width:70px;height:80vh}.chips{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><div id="floatLayer" class="float-layer"></div><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ses=null,S=null,last='',poll=null,off=0,err='',seenReactions=new Set(),selectedVote='',theme=localStorage.getItem('gs-theme')||'dark';
try{ses=JSON.parse(localStorage.getItem('gs')||'null')}catch(e){};document.documentElement.dataset.theme=theme;
const save=()=>{try{localStorage.setItem('gs',JSON.stringify(ses))}catch(e){}};const qroom=(new URLSearchParams(location.search).get('room')||'').toUpperCase();
async function api(body){const r=await fetch('/api/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Ошибка сервера');return j;}
function toggleTheme(){theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;localStorage.setItem('gs-theme',theme);}
function popEmoji(emoji){const layer=$('floatLayer');if(!layer)return;const el=document.createElement('span');el.className='float-emoji';el.textContent=emoji;el.style.left=(8+Math.random()*48)+'px';el.style.setProperty('--drift',(Math.random()*70-35)+'px');layer.appendChild(el);setTimeout(()=>el.remove(),2700);}
function syncReactions(){(S?.reactions||[]).slice().reverse().forEach(r=>{if(!seenReactions.has(r.id)){seenReactions.add(r.id);if(seenReactions.size>100)seenReactions=new Set([...seenReactions].slice(-50));popEmoji(r.emoji);}})}
async function tick(){clearTimeout(poll);if(!ses)return;try{const r=await fetch('/api/game?room='+encodeURIComponent(ses.room)+'&pid='+encodeURIComponent(ses.pid));const j=await r.json();if(r.status===404){ses=null;S=null;save();err='Комната не найдена или уже закрыта';render();return}if(r.ok){off=j.now-Date.now();const sig=JSON.stringify(Object.assign({},j,{now:0}));if(sig!==last){last=sig;S=j;render();syncReactions();}}}catch(e){}poll=setTimeout(tick,document.hidden?7000:900);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
setInterval(()=>{if(!S)return;const tm=$('tm');if(tm&&S.phase==='round'){const left=Math.max(0,180-Math.floor((Date.now()+off-S.t)/1000));tm.textContent=left>0?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'Время вышло';}const d=$('defTimer');if(d&&S.phase==='defense'){d.textContent=S.defenseLeft+' сек.';const b=document.querySelector('[data-act="reveal"]');if(b){b.disabled=S.defenseLeft>0;b.textContent=S.defenseLeft>0?'Игрок оправдывается…':'Показать результат';}}},250);
const reactions=['❤️','😂','🔥','😭','💀','👏','🤡','🫡','🐈','🗿'];
const funNames={'Хирург после эпидемии':'Доктор «я щас погуглю»','Инженер-энергетик':'Повелитель удлинителя','Учитель истории':'Человек-Википедия','Агроном-экспериментатор':'Главный по огурцам','Бывший судья':'Ваш честь, но без зарплаты','Бывший военный':'Командир дивана','Психолог-кризисолог':'Психолог для всех, кроме себя','Повар-технолог':'Шеф по дошираку','Программист-системщик':'Админ, перезагрузи мир','Механик-самоучка':'Мастер на все руки (почти)','Журналист-расследователь':'Местный сплетник с фактами','Ветеринар':'Доктор котиков','Эколог':'Защитник последнего дерева','Музыкант-мультиинструменталист':'Диджей апокалипсиса','Дипломат-переговорщик':'Профессиональный «давайте мирно»','Археолог':'Искатель чужих проблем','Фермер-практик':'Повелитель картошки','Медсестра':'Главный пластырь бункера','Радиолюбитель':'Алло, это кто?','Социолог':'Аналитик чужих драм','Изобретатель':'Гений до первого включения','Медиатор-конфликтолог':'Разниматель взрослых людей','Логист':'Человек с табличкой Excel','Философ-этик':'Специалист по вопросу «а что если?»'};
const role=p=>p?.cards?.[0]?.v||'Таинственная личность';
function header(){return `<header class="top"><div class="brand">☼ ГОРОД СОЛНЦА<small>${esc(S?.title||S?.config?.title||'игра на выживание')}</small></div><div class="top-actions"><button class="iconbtn" title="Сменить тему" data-act="theme">${theme==='dark'?'☀':'☾'}</button>${S?`<span class="pill">${esc(S.code)}</span>`:''}</div></header>`;}
function scene(content){return `<main class="scene"><div class="shell">${header()}${content}</div></main>`;}
function home(){return scene(`<section class="hero"><h1>Бункер, но с характером</h1><p>Соберите компанию, раздайте странные судьбы и выясните, кто достоин места в новом мире.</p></section><div class="split"><section class="panel"><div class="eyebrow">Для ведущего</div><h2>Создать новую игру</h2><p class="muted smalltext">Ты управляешь сессией, а игроки заходят по отдельной ссылке. Твои настройки и панель управления им не показываются.</p><div class="field"><label>Название сессии</label><input id="title" maxlength="40" placeholder="Например, Последний вай-фай"></div><div class="grid"><div class="field"><label>Максимум игроков</label><select id="maxPlayers"><option>6</option><option selected>12</option><option>16</option><option>20</option><option>24</option></select></div><div class="field"><label>Время на оправдание</label><select id="defenseSeconds"><option value="15">15 секунд</option><option value="30" selected>30 секунд</option><option value="45">45 секунд</option><option value="60">60 секунд</option><option value="90">90 секунд</option></select></div></div><div class="actions"><button class="btn primary" data-act="create">Создать комнату</button></div></section><section class="panel"><div class="eyebrow">Для игроков</div><h2>Присоединиться</h2><p class="muted smalltext">Введи код, который дал ведущий, или открой его ссылку.</p><div class="field"><label>Код комнаты</label><input id="rc" maxlength="5" placeholder="ABCDE" value="${esc(qroom)}" autocapitalize="characters"></div><div class="field"><label>Твоё имя</label><input id="nm" maxlength="20" placeholder="Как тебя называть?"></div><div class="actions"><button class="btn" data-act="join">Войти в комнату</button></div></section></div><div id="err">${esc(err)}</div>`);}
function lobby(){const l=S.lobby||[],link=location.origin+location.pathname+'?room='+S.code;const isHost=S.host;return scene(`<section class="panel"><div class="eyebrow">Комната ожидания · ${l.length}/${S.config?.maxPlayers||24}</div><h2>${isHost?'Сессия создана':'Ты в игре. Ждём остальных.'}</h2>${isHost?`<div class="split"><div><div class="code">${S.code}</div><p class="muted smalltext">Поделись ссылкой или QR-кодом. Игроки попадут прямо в комнату ожидания.</p><div class="link" id="shareLink">${esc(link)}</div><div class="actions"><button class="btn primary" data-act="copy">Скопировать ссылку</button><button class="btn" data-act="copycode">Скопировать код</button></div></div><div class="share"><img class="qr" alt="QR-код для входа" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(link)}"><div class="muted smalltext">Отсканируй камерой телефона — и ты уже в лобби.</div></div></div><div class="stat"><b>Настройки ведущего</b>${esc(S.config?.title||'Бункер')} · до ${S.config?.maxPlayers||24} игроков · ${S.config?.defenseSeconds||30} сек. на оправдание</div>`:`<p class="muted">Ты подключился как игрок. Информация ведущего и секреты других игроков скрыты.</p>`}<div class="eyebrow" style="margin-top:22px">Участники</div><div class="avatars">${l.map((p,i)=>`<div class="avatar"><i>${['🦝','🐈','🦆','🦊','🐸','🐼','🦉','🐙'][i%8]}</i><b>${esc(p.name)}${p.id===S.me?.id?' · ты':''}</b></div>`).join('')||'<div class="empty">Пока никого нет. Позови друзей!</div>'}</div>${isHost?`<div class="actions"><button class="btn primary" data-act="start" ${l.length<4?'disabled':''}>Начать игру · ${l.length} игроков</button></div><p class="muted smalltext">Для старта нужно минимум 4 игрока.</p>`:''}<div id="err">${esc(err)}</div><div class="actions"><button class="btn ghost" data-act="leave">Выйти</button></div></section>`);}
function countdown(){return `<main class="scene"><div class="shell count-wrap"><div class="brand">☼ ГОРОД СОЛНЦА</div><h2>Следующий раунд начнётся через</h2><div class="timer">${S.countdown}</div><p>Пристегните ремни. Сейчас опять начнётся демократия.</p></div></main>`;}
function card(p,own=false){const cards=p.cards||[],name=role(p),fun=funNames[name]||'Подозрительно полезный человек';return `<article class="player ${p.alive?'':'dead'}"><div class="player-head"><strong>${esc(p.name)}</strong><span class="pill">${p.alive?'в игре':'выбыл'}</span></div><div class="role">${esc(fun)}</div><div class="funline">${esc(name)}</div>${cards[2]?`<div class="stat"><b>Суперсила</b>${esc(cards[2].v)}</div>`:''}${cards[9]?`<div class="stat"><b>Слабое место</b>${esc(cards[9].v)}</div>`:''}${cards[6]?`<div class="stat"><b>Секретик</b>${esc(cards[6].v)}</div>`:''}<details class="details"><summary>Полное досье · ${cards.length} фактов</summary><div class="chips">${cards.map(c=>`<div class="chip"><small>${esc(c.t)}</small>${esc(c.v)}</div>`).join('')}</div></details>${own&&p.bond?`<div class="secret"><strong>Тайная связь</strong><p class="smalltext">${esc(p.bond.secret)}</p></div>`:''}</article>`;}
function reactionsPanel(){return `<aside class="reactions" aria-label="Реакции">${reactions.map(e=>`<button title="Отправить ${e}" data-act="react" data-emoji="${e}">${e}</button>`).join('')}</aside>`;}
function round(){const me=S.players.find(p=>p.id===S.me?.id),alive=S.players.filter(p=>p.alive);let content=`<section class="panel"><div class="eyebrow">Раунд ${S.round} · в бункере ${alive.length} · мест останется ${S.target}</div><div class="split"><div><h2>Время решить, кто остаётся</h2><p class="muted smalltext">Обсуждайте способности, нелепые слабости и подозрительные секреты.</p></div><div class="timer" id="tm">03:00</div></div></section>`;if(me)content+=`<section class="panel"><div class="eyebrow">Твоя карточка</div><h2>Вот кем тебя назначила судьба</h2>${card(me,true)}</section>`;if(S.me&&!me?.alive)content+=`<section class="panel center"><h2>Ты уже за дверью бункера 🚪</h2><p class="muted">Смотри, как разворачивается драма, и отправляй реакции. Твои смайлики будут лететь по экрану у всех.</p></section>`;content+=`<section class="panel"><div class="eyebrow">Участники · ${alive.length}</div><div class="vote-list">${alive.map(p=>`<div class="vote"><b>${esc(p.name)} ${p.id===S.me?.id?'(это ты)':''}</b><small>${esc(funNames[role(p)]||role(p))}</small>${me?.alive&&p.id!==me.id?`<button class="btn small ${S.myVote===p.id?'primary':''}" style="width:100%;margin-top:9px" data-act="vote" data-id="${p.id}">${S.myVote===p.id?'Голос учтён ✓':'Голосовать против'}</button>`:''}</div>`).join('')}</div></section>`;if(S.host)content+=`<section class="panel"><div class="eyebrow">Панель ведущего</div><h2>Управление голосованием</h2><p class="muted">Получено голосов: ${S.voted||0} из ${alive.length}</p><button class="btn primary" data-act="close">Завершить голосование</button></section>`;return scene(content)+(me&&!me.alive?reactionsPanel():'');}
function defense(){const c=S.players.find(p=>p.id===S.candidate),me=S.players.find(p=>p.id===S.me?.id),chosen=me?.id===S.candidate;let content=`<section class="panel center"><div class="eyebrow">Голосование завершено</div><h2>Большинство подозревает…</h2><div class="timer" style="font-size:32px">${esc(c?.name||'Игрок')}</div><p class="muted">${chosen?'Это ты. Время включить режим адвоката.':'Игроку дали слово. Пока слушаем его версию.'}</p><div class="timer" id="defTimer">${S.defenseLeft} сек.</div></section>`;if(chosen)content+=`<section class="panel"><div class="eyebrow">Только для тебя · секретная записка</div><h2>Тебе в руки попал компромат</h2><div class="secret"><strong>Слух из бункера</strong><p>${esc(S.rumor?.text||'Загружаем компромат…')}</p><small class="muted">Это может быть правдой, а может быть наглой клеветой. Даже игра не выдаёт подсказок.</small></div><p class="muted smalltext">Используй слух, чтобы оправдаться, перевести стрелки или устроить дипломатический скандал.</p></section>`;else content+=`<section class="panel"><p class="muted">Секретное досье видит только выбранный игрок. Остальным остаётся слушать его оправдания.</p></section>`;if(S.host)content+=`<section class="panel"><div class="eyebrow">Управление ведущего</div><button class="btn primary" data-act="reveal" ${S.defenseLeft>0?'disabled':''}>Показать, кого исключили</button></section>`;return scene(content);}
function reveal(){const c=S.players.find(p=>p.id===S.candidate);return `<main class="scene"><div class="shell count-wrap"><div class="eyebrow" style="color:#fff">Все затаили дыхание</div><h2>Кажется, решение принято…</h2><div class="timer">${S.revealLeft}</div><h2>${esc(c?.name||'Кандидат')}, держись.</h2><p>Дверь бункера уже открывается.</p></div></main>`;}
function result(){const c=S.players.find(p=>p.id===S.candidate),stay=S.players.filter(p=>p.alive);let content=`<section class="panel center"><div class="eyebrow">Раунд ${S.round} · вердикт</div><h2>За дверь отправляется</h2><div class="timer" style="font-size:34px">${esc(c?.name||'Участник')}</div><p class="muted">Голосов: ${c?.votes||0}. В бункере осталось ${stay.length} человек.</p>${c?card(c):''}</section><section class="panel"><div class="eyebrow">Кто ещё держится</div><div class="avatars">${stay.map((p,i)=>`<div class="avatar"><i>${['🦝','🐈','🦆','🦊','🐸','🐼'][i%6]}</i><b>${esc(p.name)}</b></div>`).join('')}</div></section>`;if(S.host)content+=`<section class="panel"><button class="btn primary" data-act="next">${stay.length<=S.target?'Перейти к финалу':'Начать следующий раунд'}</button></section>`;else content+=`<section class="panel muted">Ждём, пока ведущий запустит следующий этап…</section>`;if(!S.me?.alive)content+=reactionsPanel();return scene(content);}
const endingImages={mor:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1400&q=85',wise:'https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1400&q=85',mac:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1400&q=85',popper:'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=85',hobbes:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1400&q=85',tolstoy:'https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1400&q=85'};
function end(){const fates=S.playerFates||S.players.map(p=>({id:p.id,name:p.name,alive:p.alive,profession:role(p),fate:p.alive?'Остался в бункере.':'Покинул бункер.',outRound:p.outRound}));const survivors=fates.filter(p=>p.alive),gone=fates.filter(p=>!p.alive);const img=endingImages[S.endingTag]||endingImages.popper;let content=`<section class="panel"><div class="eyebrow">Финал · хроника нового общества</div><h2>${esc(S.endingTitle||S.ending?.[0]||'Новый мир')}</h2><img class="final-image" src="${img}" alt="Пейзаж финала" loading="lazy"><p>${esc(S.ending?.[1]||'Общество получило шанс начать заново.')}</p><p>${esc(S.endingText||'Выжившие определили будущее этого места.')}</p><div class="stat"><b>Что в итоге с бункером</b>${S.endingMood==='hope'?'Бункер пережил кризис и стал основой нового поселения. Запасы распределили, обязанности поделили, а старые правила постепенно заменили общими договорённостями.':'Бункер физически уцелел, но общество раскололось. Запасы тают, доверие подорвано, и выжившим придётся заново договариваться о правилах. Само убежище стало не спасением, а напоминанием о цене решений.'}</div><div class="stat"><b>Модель общества</b>${(S.verdict||[]).map(esc).join('<br>')||'Смешанная модель — ни одна идея не победила окончательно.'}</div></section><section class="panel"><div class="eyebrow">Каждый участник · персональный итог</div><h2>Чем закончилась история каждого</h2>${fates.map(p=>`<div class="fate"><div><strong>${esc(p.name)}</strong><small>${esc(p.profession)}</small><small>${esc(p.fate)}</small></div><span class="${p.alive?'badge-good':'badge-bad'}">${p.alive?'Выжил':'Выбыл'}</span></div>`).join('')}</section><section class="panel"><div class="eyebrow">Статистика партии</div><div class="grid"><div class="stat"><b>Основатели</b>${survivors.length}</div><div class="stat"><b>Выбывшие</b>${gone.length}</div><div class="stat"><b>Сохранившиеся связи</b>${S.synergy||0}</div><div class="stat"><b>Раундов сыграно</b>${S.round}</div></div><p class="muted smalltext">${S.endingMood==='hope'?'Финал с надеждой: сотрудничество оказалось сильнее подозрений.':'Финал с горьким послевкусием: выжить удалось, но единства не получилось.'}</p></section><section class="panel"><h2>Вопрос для философского спора</h2><p>Справедливо ли большинство поступило с теми, кого исключило? И какое общество получилось бы, если бы решение принимали не голосованием, а по принципам равенства, договора или ненасилия?</p><button class="btn primary" data-act="leave">Вернуться на главную</button></section>`;return scene(content);}
function render(){let h;if(!ses)h=home();else if(!S)h=scene('<section class="panel center"><div class="timer">…</div><p>Подключаемся к бункеру</p></section>');else h={lobby,round,countdown,defense,reveal,result,end}[S.phase]?.()||home();$('app').innerHTML=h;}
async function act(a,el){err='';try{if(a==='theme'){toggleTheme();render();return;}if(a==='create'){const title=$('title')?.value||'Бункер',maxPlayers=Number($('maxPlayers')?.value||12),defenseSeconds=Number($('defenseSeconds')?.value||30);const j=await api({a:'create',title,maxPlayers,defenseSeconds});ses={room:j.code,pid:j.pid};save();S=null;last='';history.replaceState(null,'','?room='+j.code);render();tick();return;}if(a==='join'){const room=$('rc').value.trim().toUpperCase(),name=$('nm').value.trim();if(!room||!name){err='Введи код комнаты и имя.';render();return;}const j=await api({a:'join',room,name,pid:ses&&ses.room===room?ses.pid:undefined});ses={room:j.code,pid:j.pid};save();S=null;last='';history.replaceState(null,'','?room='+j.code);render();tick();return;}if(a==='copy'||a==='copycode'){const text=a==='copy'?location.origin+location.pathname+'?room='+S.code:S.code;await navigator.clipboard.writeText(text);toast('Скопировано ✓');return;}if(a==='leave'){ses=null;S=null;last='';save();history.replaceState(null,'',location.pathname);render();return;}if(a==='react'){await api({a:'react',room:ses.room,pid:ses.pid,emoji:el.dataset.emoji});popEmoji(el.dataset.emoji);return;}const body={a,room:ses.room,pid:ses.pid};if(a==='vote')body.target=el.dataset.id;await api(body);last='';tick();}catch(e){err=e.message||'Что-то пошло не так';if(S)render();else{const node=$('err');if(node)node.textContent=err;}}}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act,b);});render();if(ses)tick();
</script></body></html>
